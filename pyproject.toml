[project]
name = "plainnotes"
version = "1.0.0"
description = "Self-hosted, single-user web app for writing and finding plain-text notes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = ["fastapi", "uvicorn"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "BLE", "T20", "ANN"]
ignore = [
    "S104",  # binding to 0.0.0.0 is the documented container default
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108", "S603", "S607", "S310", "ANN", "RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Starlette 1.x suggests httpx2 for its TestClient; the tests use httpx, which still works.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "e2e: browser tests with Playwright and Chromium",
    "docker: container smoke tests (need a Docker daemon)",
]
