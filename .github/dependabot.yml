version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # Stay on Python 3.13, which requirements.txt is compiled for; take its patch releases.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
